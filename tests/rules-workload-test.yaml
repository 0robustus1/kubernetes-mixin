rule_files:
- ../prometheus_rules.yaml

evaluation_interval: 1m

tests:
  # Prefer the controller owner when a pod has multiple owner references
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="agent-abc",owner_is_controller="true",owner_kind="DaemonSet",owner_name="agent",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="agent-abc",owner_is_controller="false",owner_kind="ConfigMap",owner_name="agent-config",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="agent-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="agent-abc",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:relabel
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="agent",workload_type="daemonset"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="agent",workload_type="daemonset"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="agent",workload_type="daemonset"}'
        value: 1

  # Record ready pods for each built-in workload ownership path.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-abc",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="api-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-abc",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="api-rs",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-abc",owner_is_controller="false",owner_kind="ConfigMap",owner_name="api-config",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="api-rs",owner_is_controller="true",owner_kind="Deployment",owner_name="api",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="api-rs",owner_is_controller="true",owner_kind="Deployment",owner_name="api",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="api-rs",owner_is_controller="false",owner_kind="Rollout",owner_name="api-rollout",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="api-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="api-abc",condition="true",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="api-abc",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-def",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="api-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="api-def",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '0 0'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="cache-abc",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="cache",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="cache",owner_kind="",owner_name="",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="cache-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="cache-abc",phase="Pending",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="database-0",owner_is_controller="true",owner_kind="StatefulSet",owner_name="database",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="database-0",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="database-0",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="migrate-abc",owner_is_controller="true",owner_kind="Job",owner_name="migrate",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="migrate",owner_kind="",owner_name="",owner_is_controller="",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="migrate-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="migrate-abc",phase="Succeeded",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="worker-abc",owner_is_controller="true",owner_kind="Job",owner_name="worker",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="worker",owner_kind="Pod",owner_name="launcher",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="worker",owner_kind="Pod",owner_name="launcher",owner_is_controller="true",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="worker-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="worker-abc",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_spec_completions{cluster="test",namespace="default",job_name="worker",job="kube-state-metrics",instance="ksm-1"}'
      values: '4 4'
    - series: 'kube_job_spec_completions{cluster="test",namespace="default",job_name="worker",job="kube-state-metrics",instance="ksm-2"}'
      values: '4 4'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="worker-followup",owner_kind="Pod",owner_name="launcher",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_spec_completions{cluster="test",namespace="default",job_name="worker-followup",job="kube-state-metrics",instance="ksm-1"}'
      values: '2 2'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:relabel
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="api",workload_type="deployment"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="cache",workload_type="replicaset"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="database",workload_type="statefulset"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="launcher",workload_type="pod"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="migrate",workload_type="job"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="api",workload_type="deployment"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="cache",workload_type="replicaset"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="database",workload_type="statefulset"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="migrate",workload_type="job"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="launcher",workload_type="pod"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Pending",workload="cache",workload_type="replicaset"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="api",workload_type="deployment"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="database",workload_type="statefulset"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="launcher",workload_type="pod"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Succeeded",workload="migrate",workload_type="job"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_desired:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_desired:sum{cluster="test",namespace="default",workload="launcher",workload_type="pod"}'
        value: 6

  # Record ready pods for custom controllers and Jobs without a controller owner.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="kafka-0",owner_is_controller="true",owner_kind="StrimziPodSet",owner_name="kafka",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="kafka-0",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="kafka-0",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="cleanup-abc",owner_is_controller="true",owner_kind="Job",owner_name="cleanup-123",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="cleanup-123",owner_kind="CronJob",owner_name="cleanup",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="cleanup-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="cleanup-abc",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="worker-abc",owner_is_controller="true",owner_kind="Job",owner_name="worker",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="worker",owner_kind="Pod",owner_name="launcher",owner_is_controller="false",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="worker-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="worker-abc",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="rollout-abc",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="rollout-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="rollout-rs",owner_kind="Rollout",owner_name="rollout",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="rollout-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="rollout-abc",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_spec_completions{cluster="test",namespace="default",job_name="cleanup-123",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_spec_replicas{cluster="test",namespace="default",replicaset="rollout-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '2 2'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="cleanup-old-abc",owner_is_controller="true",owner_kind="Job",owner_name="cleanup-old",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_owner{cluster="test",namespace="default",job_name="cleanup-old",owner_kind="CronJob",owner_name="cleanup",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="cleanup-old-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '0 0'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="cleanup-old-abc",phase="Succeeded",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_job_spec_completions{cluster="test",namespace="default",job_name="cleanup-old",job="kube-state-metrics",instance="ksm-1"}'
      values: '3 3'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="rollout-old-abc",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="rollout-old-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="rollout-old-rs",owner_kind="Rollout",owner_name="rollout",owner_is_controller="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="rollout-old-abc",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="rollout-old-abc",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_replicaset_spec_replicas{cluster="test",namespace="default",replicaset="rollout-old-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '3 3'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:relabel
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="cleanup",workload_type="CronJob"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="kafka",workload_type="StrimziPodSet"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="rollout",workload_type="Rollout"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="worker",workload_type="job"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="cleanup",workload_type="CronJob"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="kafka",workload_type="StrimziPodSet"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="rollout",workload_type="Rollout"}'
        value: 2
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="worker",workload_type="job"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="cleanup",workload_type="CronJob"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="kafka",workload_type="StrimziPodSet"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="rollout",workload_type="Rollout"}'
        value: 2
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="worker",workload_type="job"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Succeeded",workload="cleanup",workload_type="CronJob"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_desired:sum{workload=~"cleanup|cleanup-123|rollout|rollout-rs"}

  # Preserve bare and static pod workloads without accepting non-controller owners.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="bare-pod",owner_is_controller="",owner_kind="",owner_name="",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="bare-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="default",pod="bare-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="kube-system",pod="static-pod",owner_is_controller="true",owner_kind="Node",owner_name="node-1",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="kube-system",pod="static-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_phase{cluster="test",namespace="kube-system",pod="static-pod",phase="Running",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="referenced-pod",owner_is_controller="false",owner_kind="ConfigMap",owner_name="pod-config",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'
    - series: 'kube_pod_status_ready{cluster="test",namespace="default",pod="referenced-pod",condition="true",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1'

    promql_expr_test:
    - eval_time: 1m
      expr: namespace_workload:kube_pod_owner:relabel
      exp_samples:
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="default",workload="bare-pod",workload_type="barepod"}'
        value: 1
      - labels: 'namespace_workload:kube_pod_owner:relabel{cluster="test",namespace="kube-system",workload="static-pod",workload_type="staticpod"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_ready:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="default",workload="bare-pod",workload_type="barepod"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_ready:sum{cluster="test",namespace="kube-system",workload="static-pod",workload_type="staticpod"}'
        value: 1
    - eval_time: 1m
      expr: namespace_workload:kube_pods_phase:sum
      exp_samples:
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="default",phase="Running",workload="bare-pod",workload_type="barepod"}'
        value: 1
      - labels: 'namespace_workload:kube_pods_phase:sum{cluster="test",namespace="kube-system",phase="Running",workload="static-pod",workload_type="staticpod"}'
        value: 1

  # Aggregate all pod phases without double-counting redundant KSM producers.
  - interval: 1m
    input_series:
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-a",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="api-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-a",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="api-rs",job="kube-state-metrics",instance="ksm-2"}'
      values: '1 1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-a",owner_is_controller="false",owner_kind="ConfigMap",owner_name="api-config",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-b",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="api-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1 1'
    - series: 'kube_pod_owner{cluster="test",namespace="default",pod="api-c",owner_is_controller="true",owner_kind="ReplicaSet",owner_name="api-rs",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1 1'
    - series: 'kube_replicaset_owner{cluster="test",namespace="default",replicaset="api-rs",owner_is_controller="true",owner_kind="Deployment",owner_name="api",job="kube-state-metrics",instance="ksm-1"}'
      values: '1 1 1'
